name: "✨ Feature request"
description: "Suggest a new feature or editor improvement"
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current situation and why the existing behavior is not enough.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how the feature should look and behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Is there another way to solve the same problem?

  - type: textarea
    id: media
    attributes:
      label: Mockups, screenshots, or examples
      description: Attach images or links if they help explain the idea.
