name: "🐞 Bug report"
description: "Сообщить о вылете, пропавшем блоке, неверной позиции или конфликте с другим модом"
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Pause Menu Studio экспериментальный и сильно зависит от других модов.
        Чем точнее информация ниже, тем выше шанс воспроизвести и исправить проблему.

  - type: input
    id: pms-version
    attributes:
      label: Версия Pause Menu Studio
      description: Указана в списке модов Geode.
      placeholder: "v2.1.0"
    validations:
      required: true

  - type: input
    id: geode-gd-version
    attributes:
      label: Версии Geometry Dash и Geode
      placeholder: "Geometry Dash 2.2081, Geode 5.8.2"
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: Тип проблемы
      options:
        - Вылет
        - Пропавший или невидимый блок
        - Неверная позиция или размер
        - SAVE / LAYOUTS / Apply
        - Hidden Blocks / Reset
        - Jukebox / NONGD
        - Better Volume
        - Клавиатура / Esc / Space
        - Текстур-пак
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Точные шаги воспроизведения
      description: Перечисли действия с момента входа в уровень.
      placeholder: |
        1. Открыл уровень ...
        2. Нажал Esc...
        3. Включил Edit Mode...
        4. Ошибка появилась после...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло вместо этого?
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Активные моды
      description: Особенно важны NONGD/Jukebox, Better Volume, Better Escape, Menu Animations, GodlikeFaces, Integrated Demonlist, GDDP и Demons in Between.
      placeholder: "Вставь список активных модов и их версии"
    validations:
      required: true

  - type: input
    id: texture-pack
    attributes:
      label: Текстур-пак
      description: Напиши название или "не используется".
      placeholder: "Название пака / не используется"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи и crashlog
      description: Перетащи сюда latest.log и crashlog. Для вылета crashlog обязателен.
      placeholder: "Прикрепи файлы или вставь ссылку"

  - type: textarea
    id: media
    attributes:
      label: Скриншоты или видео
      description: Перетащи сюда изображение либо короткое видео визуальной ошибки.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Проверка
      options:
        - label: Я полностью перезапустил Geometry Dash и повторил проблему.
          required: true
        - label: Я приложил достаточно данных, чтобы повторить ошибку.
          required: true
