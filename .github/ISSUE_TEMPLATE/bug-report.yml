name: "🐞 Bug report"
description: "Report a crash, missing block, incorrect position, or compatibility problem"
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report! Pause Menu Studio is experimental and interacts with many other mods.
        Accurate information below makes the issue much easier to reproduce and fix.

  - type: input
    id: pms-version
    attributes:
      label: Pause Menu Studio version
      description: Find it in the Geode mod list.
      placeholder: "v2.1.0"
    validations:
      required: true

  - type: input
    id: geode-gd-version
    attributes:
      label: Geometry Dash and Geode versions
      placeholder: "Geometry Dash 2.2081, Geode 5.8.2"
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: Problem type
      options:
        - Crash
        - Missing or invisible block
        - Incorrect position or scale
        - SAVE / LAYOUTS / Apply
        - Hidden Blocks / Reset
        - Jukebox / NONGD
        - Better Volume
        - Keyboard / Esc / Space
        - Texture pack
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Exact reproduction steps
      description: List every action starting from entering the level.
      placeholder: |
        1. Opened level ...
        2. Pressed Esc ...
        3. Enabled Edit Mode ...
        4. The problem appeared after ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Enabled mods
      description: NONGD/Jukebox, Better Volume, Better Escape, Menu Animations, GodlikeFaces, Integrated Demonlist, GDDP, and Demons in Between are especially important.
      placeholder: "Paste the enabled-mod list and versions"
    validations:
      required: true

  - type: input
    id: texture-pack
    attributes:
      label: Texture pack
      description: Enter its name or "None".
      placeholder: "Texture-pack name / None"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and crashlog
      description: Drag latest.log and the crashlog here. A crashlog is required for crashes.
      placeholder: "Attach the files or paste a link"

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag an image or a short video of the visual problem here.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I fully restarted Geometry Dash and reproduced the problem again.
          required: true
        - label: I included enough information to reproduce the problem.
          required: true
