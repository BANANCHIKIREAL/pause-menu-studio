<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Pause Menu Studio</title>
  <desc id="desc">A complete visual pause-menu editor for Geometry Dash.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.48" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#170d2c"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e8ff"/>
      <stop offset="0.36" stop-color="#72ffd4"/>
      <stop offset="0.68" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="softSpectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e8ff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#72ffd4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#55e8ff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#55e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="324" rx="34" fill="url(#surface)" stroke="url(#spectrum)" stroke-width="4"/>
  <ellipse cx="165" cy="55" rx="260" ry="180" fill="url(#cyanGlow)"/>
  <ellipse cx="1060" cy="290" rx="310" ry="200" fill="url(#purpleGlow)"/>
  <path d="M42 90H1158" stroke="url(#softSpectrum)" stroke-width="2"/>
  <path d="M42 276H1158" stroke="url(#softSpectrum)" stroke-width="2"/>

  <g transform="translate(58 47)">
    <rect width="58" height="58" rx="16" fill="#08111f" stroke="url(#spectrum)" stroke-width="3"/>
    <path d="M17 18h24M17 29h24M17 40h14" stroke="url(#spectrum)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="40" r="7" fill="#08111f" stroke="#e879f9" stroke-width="3"/>
  </g>

  <text x="600" y="172" text-anchor="middle" fill="url(#spectrum)" filter="url(#glow)"
        font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" letter-spacing="2">PAUSE MENU STUDIO</text>
  <text x="600" y="215" text-anchor="middle" fill="#e8f5ff"
        font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="1">BUILD THE PAUSE MENU YOU WANT</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(292 246)"><rect x="-98" y="0" width="196" height="42" rx="21" fill="#0a1828" stroke="#55e8ff"/><text y="27" fill="#9af2ff">VISUAL EDITOR</text></g>
    <g transform="translate(500 246)"><rect x="-90" y="0" width="180" height="42" rx="21" fill="#0a1c20" stroke="#72ffd4"/><text y="27" fill="#a8ffe6">NAMED LAYOUTS</text></g>
    <g transform="translate(697 246)"><rect x="-91" y="0" width="182" height="42" rx="21" fill="#151329" stroke="#a78bfa"/><text y="27" fill="#d7c9ff">HIDDEN BLOCKS</text></g>
    <g transform="translate(906 246)"><rect x="-101" y="0" width="202" height="42" rx="21" fill="#1c1026" stroke="#e879f9"/><text y="27" fill="#f4b5ff">WINDOWS + ANDROID</text></g>
  </g>
</svg>
